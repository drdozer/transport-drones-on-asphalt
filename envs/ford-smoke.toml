# Hermetic ford smoke for transport-drones-on-asphalt: the water-ford
# integration cell — tdoa + official Transport_Drones 2.1.4 + water-ford
# 1.1.0 (published portal zip; the cobblestone ladder: cobblestone-ford +
# cobblestone-path road cases; wooden ford negative = player-only by design).
#
# water-ford is PINNED to the released 1.1.0 zip (pin overrides the live-root
# priority of the linked submodule — docs/test-envs.md); the pin tracks the
# version tdoa's info.json floors ("? water-ford >= 1.1.0"). Repinned
# 2026-10-22 from the in-flight working tree to the published artifact —
# this env is the co-release verification cell.
#
# Provisions .cache/envs/dlc/ford-smoke-<hash8>/ — format contract:
# docs/test-envs.md (superproject).
spec_version = 1
description = "tdoa ford smoke: tdoa + Transport_Drones 2.1.4 + water-ford 1.1.0 (published zip; cobble ladder road cases + wooden ford negative)"

install = "dlc"

# water-ford is an own-mods submodule, but this env deliberately serves the
# RELEASED zip: roots stays empty (an explicit root outranks pins), the
# optional dep enters via stub, and the pin selects exactly the published
# 1.1.0 (fetched into the shared zip cache) — the py-smoke pattern.
roots = []
chase_deps = true
without = []
stub = ["water-ford"]

fetch = [
  "Transport_Drones@2.1.4",
  "water-ford@1.1.0",
]

[pins]
Transport_Drones = "2.1.4"
water-ford = "1.1.0"